backend:
  name: github
  repo: Karhut/site-arpica
  branch: main

auth:
  endpoint: /api/auth
  persistence: localStorage

media_folder: images/uploads
public_folder: /images/uploads

# Configuração de collections (páginas editáveis)
collections:
  
  # ========== ATIVIDADES ==========
  - name: actividades
    label: "Atividades"
    folder: _data/actividades
    create: true
    format: json
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição", name: "description", widget: "markdown" }
      - { label: "Imagem", name: "image", widget: "image", required: false }
      - { label: "Serviços (um por linha)", name: "services", widget: "list" }
      - { label: "Horário", name: "schedule", widget: "string", required: false }
      - { label: "Local", name: "location", widget: "string", required: false }
      - { label: "Link Contacto", name: "contact_link", widget: "string", required: false }

  # ========== DIREÇÃO ==========
  - name: direcao
    label: "Membros da Direção"
    folder: _data/direcao
    create: true
    format: json
    fields:
      - { label: "Nome Completo", name: "name", widget: "string" }
      - { label: "Cargo", name: "role", widget: "string" }
      - { label: "Secção", name: "section", widget: "select", options: ["Direção", "Conselho Fiscal", "Assembleia Geral"] }
      - { label: "Descrição", name: "description", widget: "text", required: false }
      - { label: "Imagem", name: "image", widget: "image", required: false }
      - { label: "Email", name: "email", widget: "string", required: false }

  # ========== DOCUMENTOS ==========
  - name: documentos
    label: "Documentos"
    folder: _data/documentos
    create: true
    format: json
    fields:
      - { label: "Ano", name: "year", widget: "number" }
      - { label: "Tipo", name: "type", widget: "select", options: ["Contas", "Relatório", "Estatutos", "Outro"] }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Link PDF (URL)", name: "url", widget: "string" }
      - { label: "Descrição", name: "description", widget: "text", required: false }

  # ========== NOTÍCIAS (Novo!) ==========
  - name: noticias
    label: "Notícias & Eventos"
    folder: _data/noticias
    create: true
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data do Evento", name: "date", widget: "datetime" }
      - { label: "Resumo/Preview", name: "excerpt", widget: "text" }
      - { label: "Conteúdo Completo", name: "body", widget: "markdown" }
      - { label: "Imagem", name: "image", widget: "image", required: false }
      - { label: "Autor", name: "author", widget: "string", required: false }
      - { label: "Publicado?", name: "published", widget: "boolean", default: true }

  # ========== CONFIGURAÇÃO DO SITE ==========
  - name: config
    label: "⚙️ Configurações"
    files:
      - name: siteinfo
        label: "Informações da ARPICA"
        file: _data/siteinfo.json
        fields:
          - { label: "Nome da Instituição", name: "institution_name", widget: "string" }
          - { label: "Morada", name: "address", widget: "string" }
          - { label: "Código Postal", name: "postal_code", widget: "string" }
          - { label: "Cidade", name: "city", widget: "string" }
          - { label: "Telefone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
          - { label: "Horário (2ª-6ª)", name: "hours_weekday", widget: "string" }
          - { label: "Horário (Sábado)", name: "hours_saturday", widget: "string" }
          - { label: "Horário (Domingo)", name: "hours_sunday", widget: "string" }
          - { label: "Descrição Breve", name: "description", widget: "text" }

# Habilitar editor visual (preview)
editor:
  preview: true

# Modo editorial (requere aprovação antes de publicar)
publish_mode: editorial_workflow
