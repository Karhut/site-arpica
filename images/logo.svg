<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo de fundo -->
  <circle cx="100" cy="100" r="95" fill="#2c5282" opacity="0.1"/>
  
  <!-- Mão/Coração - símbolo de solidariedade -->
  <g transform="translate(50, 40)">
    <!-- Coração -->
    <path d="M 50 30 Q 50 20 60 20 Q 70 20 70 30 Q 70 20 80 20 Q 90 20 90 30 Q 90 50 70 65 Q 50 50 50 30 Z" 
          fill="#e74c3c" stroke="#2c5282" stroke-width="2"/>
    
    <!-- Mão -->
    <circle cx="35" cy="60" r="8" fill="#2c5282"/>
    <circle cx="25" cy="55" r="7" fill="#2c5282" opacity="0.8"/>
    <circle cx="20" cy="40" r="7" fill="#2c5282" opacity="0.8"/>
  </g>
  
  <!-- Texto ARPICA -->
  <text x="100" y="160" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c5282" font-family="Arial, sans-serif">ARPICA</text>
  <text x="100" y="180" font-size="8" text-anchor="middle" fill="#e74c3c" font-family="Arial, sans-serif">Desde 1983</text>
</svg>
